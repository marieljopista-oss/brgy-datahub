<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Forgot Password – Barangay DataHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Nunito',sans-serif; background:#d6eaf8; display:flex;
           flex-direction:column; align-items:center; justify-content:center;
           min-height:100vh; color:#1a3a4a; }
    .card { background:#a9cfe0; border-radius:14px; padding:40px 48px;
            text-align:center; max-width:400px; width:100%;
            box-shadow:0 4px 24px rgba(26,111,138,.10); }
    h2 { font-size:1.4rem; font-weight:800; color:#1a6f8a; margin-bottom:10px; }
    p  { font-size:.9rem; margin-bottom:20px; opacity:.8; }
    a  { display:inline-block; padding:10px 32px; background:#1a6f8a;
         color:#fff; border-radius:50px; font-weight:700; text-decoration:none; }
    a:hover { background:#145f78; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Forgot Password</h2>
    <p>Please contact your Barangay administrator to reset your password.</p>
    <a href="{% url 'login' %}">← Back to Login</a>
  </div>
</body>
</html>
