{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Barangay DataHub — Home</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}"/>
  <link rel="stylesheet" href="{% static 'css/home.css' %}"/>
</head>
<body>

  <!-- Top bar -->
  <div class="home-topbar">
    <div class="home-brand">
      🏛️ Barangay DataHub
      <span>Profiling &amp; Socio-Economic Management System</span>
    </div>
    <a href="{% url 'profile' %}" class="user-avatar" title="My Profile">👤</a>
  </div>

  <div class="home-body">
    <div class="home-welcome">
      <h2>Welcome back!</h2>
      <p>Select a module below to manage your barangay data.</p>
    </div>

    <div class="menu-grid">

      <a href="{% url 'dashboard' %}" class="menu-btn">
        <span class="menu-icon">📊</span>
        <span class="menu-label">Dashboard</span>
        <span class="menu-desc">Overview &amp; Summary</span>
      </a>

      <a href="{% url 'residents' %}" class="menu-btn">
        <span class="menu-icon">👥</span>
        <span class="menu-label">Residents</span>
        <span class="menu-desc">Profiles &amp; Records</span>
      </a>

      <a href="{% url 'reports' %}" class="menu-btn">
        <span class="menu-icon">📄</span>
        <span class="menu-label">Reports</span>
        <span class="menu-desc">Analytics &amp; Export</span>
      </a>

      <a href="{% url 'settings' %}" class="menu-btn">
        <span class="menu-icon">⚙️</span>
        <span class="menu-label">Settings</span>
        <span class="menu-desc">Config &amp; Users</span>
      </a>

    </div>
  </div>

  <script src="{% static 'css/app.js' %}"></script>

</body>
</html>
