{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Barangay DataHub — Login</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
</head>
<body>

    <h1 class="login-title">Barangay DataHub</h1>

    <div class="login-card"> 
        <div class="login-icon">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" 
                 stroke="#1a6278" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
        </div>

        <form method="POST">
            {% csrf_token %}
            
            {% if error %}
                <p style="color: red; text-align: center; font-size: 0.8em;">{{ error }}</p>
            {% endif %}

            <label class="field-label">Username</label> 
            <input type="text" name="username" placeholder="Enter username" required /> 

            <label class="field-label">Password</label> 
            <input type="password" name="password" placeholder="Enter password" required /> 

            <button type="submit" class="btn btn-primary login-btn">LOGIN</button>
        </form>

        <a href="#" class="forgot-link">Forgot Password?</a> 
    </div>

</body>
</html>
