{% load static %}
<!DOCTYPE html> 

<html lang="en"> 

<head> 

  <meta charset="UTF-8" /> 

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/> 

  <title>Barangay DataHub — Profile</title> 

  <link rel="stylesheet" href="{% static 'css/style.css' %}" /> 

  <link rel="stylesheet" href="{% static 'css/profile.css' %}" /> 

</head> 

<body> 

 

  <!-- Top navigation bar --> 

  <div class="topbar"> 

    <div class="topbar-left"> 

      <a href="{% url 'home' %}" class="btn-back">&#8592;</a> 

      <span class="topbar-badge">PROFILE</span> 

    </div> 

    <!-- Avatar links back to itself (current page) --> 

    <a href="{% url 'profile' %}" class="user-avatar">&#128100;</a> 

  </div> 

 

  <div class="page-content" style="max-width: 560px; margin: 0 auto; padding-top: 28px;"> 

 

    <!-- Profile card: banner + body --> 

    <div style="border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(26,98,120,0.12); margin-bottom: 20px;"> 

 

      <!-- Colored banner at the top --> 

      <div class="profile-banner"> 

        <!-- Avatar overlaps banner and body --> 

        <div class="profile-avatar">&#128100;</div> 

      </div> 

 

      <!-- Card body with all fields --> 

      <div class="profile-card-body"> 

 

        <!-- Shown name and role (filled dynamically by the system) --> 

        <div class="profile-name">—</div> 

        <div class="profile-role-tag">Barangay Official</div> 

 

        <!-- Account Information section --> 

        <div class="profile-section-title">Account Information</div> 

 

        <div class="profile-field"> 

          <label>Barangay Official (Role)</label> 

          <input type="text" placeholder="e.g., Captain, Secretary, Health Worker" /> 

        </div> 

 

        <div class="profile-field"> 

          <label>Name</label> 

          <input type="text" placeholder="Enter full name" /> 

        </div> 

 

        <div class="profile-field"> 

          <label>Email Address</label> 

          <input type="email" placeholder="Enter email address" /> 

        </div> 

 

        <div class="profile-field"> 

          <label>Contact</label> 

          <input type="tel" placeholder="+63 9XX XXX XXXX" /> 

        </div> 

 

        <!-- Security section --> 

        <div class="profile-section-title" style="margin-top: 8px;">Security</div> 

 

        <div class="profile-field"> 

          <label>Password</label> 

          <input type="password" placeholder="Enter new password to change" /> 

        </div> 

 

        <!-- Save button --> 

        <button class="btn btn-primary" style="width:100%; justify-content:center; margin-bottom:12px; padding:13px; font-size:14px; letter-spacing:1px;"> 

          &#128190; Save Changes 

        </button> 

 

        <div class="divider"></div> 

 

        <!-- Logout --> 

        <a href="{% url 'login' %}" class="btn btn-danger btn-logout">&#128682; LOGOUT</a> 

 

      </div> 

    </div> 

 

  </div> 

 

</body> 

</html>
