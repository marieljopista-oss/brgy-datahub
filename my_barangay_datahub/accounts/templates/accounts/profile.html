<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Barangay DataHub — Profile</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="profile.css"/>
</head>
<body>

  <!-- Top navigation bar -->
  <div class="topbar">
    <div class="topbar-left">
      <a href="home.html" class="btn-back" title="Back to Home">←</a>
      <span class="topbar-badge">PROFILE</span>
    </div>
    <a href="profile.html" class="user-avatar" title="My Profile">👤</a>
  </div>

  <div class="profile-wrap">
    <div class="profile-card">

      <!-- Banner + Avatar -->
<div class="profile-banner">
  <div class="profile-avatar" id="avatarWrapper">
    <img id="profileImg" src="" alt="" style="display:none; width:100%; height:100%; object-fit:cover; border-radius:50%;"/>
    <span id="avatarEmoji">👤</span>
    <!-- Hidden file input -->
    <input type="file" id="photoUpload" accept="image/*"
           style="display:none;" onchange="handlePhotoUpload(event)"/>
    <!-- Camera overlay button -->
    <div class="avatar-edit-btn" id="cameraBtn"
      onclick="document.getElementById('photoUpload').click()"
      title="Change photo"
      style="display:none;">
      📷
    </div>
  </div>
</div>

      <div class="profile-body">

        <!-- Name + role (filled by Django context: {{ user.get_full_name }} ) -->
        <div class="profile-name" id="displayName">—</div>
        <div class="profile-role-tag" id="displayRole">Barangay Official</div>

        <!-- ---- ACCOUNT INFORMATION ---- -->
        <div class="profile-section">Account Information</div>

        <div class="profile-field">
          <label for="pRole">Barangay Official Role</label>
          <select id="pRole">
            <option value="">Select role...</option>
            <option>Captain</option>
            <option>Secretary</option>
            <option>Health Worker</option>
            <option>Treasurer</option>
            <option>Councilor</option>
          </select>
        </div>

        <div class="profile-field">
          <label for="pName">Full Name</label>
          <input type="text" id="pName" placeholder="Enter your full name"/>
        </div>

        <div class="profile-field">
          <label for="pEmail">Email Address</label>
          <input type="email" id="pEmail" placeholder="Enter email address"/>
        </div>

        <div class="profile-field">
          <label for="pContact">Contact Number</label>
          <input type="tel" id="pContact" placeholder="+63 9XX XXX XXXX"/>
        </div>
          
      <div id="passwordSection" style="display:none;">
        <!-- ---- CHANGE PASSWORD ---- -->
        <div class="profile-section">Change Password</div>

        <div class="profile-field">
          <label for="pCurrPw">Current Password</label>
          <input type="password" id="pCurrPw" placeholder="Enter current password"/>
        </div>

        <div class="profile-field">
          <label for="pNewPw">New Password</label>
          <input type="password" id="pNewPw" placeholder="Enter new password"/>
        </div>

        <div class="profile-field">
          <label for="pConfirmPw">Confirm New Password</label>
          <input type="password" id="pConfirmPw" placeholder="Re-enter new password"/>
        </div>
      
      </div>

        <!-- Edit button (shown by default) -->
        <button id="editBtn" class="btn btn-primary btn-full mt-12"
          onclick="enableEdit()"
          style="padding:13px; font-size:14px; letter-spacing:0.5px; border-radius:12px;">
          ✏️ Edit Profile
        </button>

<!-- Save + Cancel (hidden until edit mode) -->
<button id="saveBtn" class="btn btn-primary btn-full mt-12"
  onclick="saveProfile()"
  style="display:none; padding:13px; font-size:14px; letter-spacing:0.5px; border-radius:12px;">
  💾 Save Changes
</button>
<button id="cancelBtn" class="btn btn-outline btn-full"
  onclick="cancelEdit()"
  style="display:none; padding:13px; font-size:14px; border-radius:12px; margin-top:10px;">
  ✕ Cancel
</button>

        <div class="divider"></div>

        <!-- Logout -->
        <a href="login.html" class="btn btn-danger btn-logout" onclick="return confirmLogout()">
          🚪 LOGOUT
        </a>

      </div>
    </div>
  </div>

<script src="app.js"></script>
<script>

  /* ── Load saved profile on page open ── */
  window.addEventListener('DOMContentLoaded', function() {
    const saved = JSON.parse(localStorage.getItem('userProfile') || '{}');
    if (saved.name)    { document.getElementById('pName').value    = saved.name;    updateDisplay(); }
    if (saved.email)   { document.getElementById('pEmail').value   = saved.email;   }
    if (saved.contact) { document.getElementById('pContact').value = saved.contact; }
    if (saved.role)    { document.getElementById('pRole').value    = saved.role;    updateDisplay(); }
    lockFields(); /* always start in locked/view mode */
    /* Load saved photo */
    const savedPhoto = localStorage.getItem('profilePhoto');
    showProfilePhoto(savedPhoto);
  });

  /* ── Update display name + role at top ── */
  function updateDisplay() {
    const name = document.getElementById('pName').value;
    const role = document.getElementById('pRole').value;
    document.getElementById('displayName').textContent = name || '—';
    document.getElementById('displayRole').textContent = role || 'Barangay Official';
  }

  /* ── Lock all fields (view mode) ── */
  function lockFields() {
    const fields = ['pName','pEmail','pContact','pRole','pCurrPw','pNewPw','pConfirmPw'];
    fields.forEach(function(id) {
      document.getElementById(id).disabled = true;
    });
    document.getElementById('editBtn').style.display    = 'block';
    document.getElementById('saveBtn').style.display    = 'none';
    document.getElementById('cancelBtn').style.display  = 'none';
    document.getElementById('passwordSection').style.display = 'none';
    document.getElementById('cameraBtn').style.display       = 'none'; 
  }

  /* ── Unlock all fields (edit mode) ── */
  function enableEdit() {
    const fields = ['pName','pEmail','pContact','pRole','pCurrPw','pNewPw','pConfirmPw'];
    fields.forEach(function(id) {
      document.getElementById(id).disabled = false;
    });
    document.getElementById('editBtn').style.display    = 'none';
    document.getElementById('saveBtn').style.display    = 'block';
    document.getElementById('cancelBtn').style.display  = 'block';
    document.getElementById('passwordSection').style.display = 'block';
    document.getElementById('cameraBtn').style.display = 'flex';
  }

  /* ── Cancel edit ── */
  function cancelEdit() {
    lockFields();
    /* reload saved values */
    const saved = JSON.parse(localStorage.getItem('userProfile') || '{}');
    document.getElementById('pName').value    = saved.name    || '';
    document.getElementById('pEmail').value   = saved.email   || '';
    document.getElementById('pContact').value = saved.contact || '';
    document.getElementById('pRole').value    = saved.role    || '';
    document.getElementById('pCurrPw').value  = '';
    document.getElementById('pNewPw').value   = '';
    document.getElementById('pConfirmPw').value = '';
    updateDisplay();
    showToast('Edit cancelled.', 'info');
  }

  /* ── Save profile ── */
  function saveProfile() {
    const name      = document.getElementById('pName').value.trim();
    const email     = document.getElementById('pEmail').value.trim();
    const contact   = document.getElementById('pContact').value.trim();
    const role      = document.getElementById('pRole').value;
    const newPw     = document.getElementById('pNewPw').value;
    const confirmPw = document.getElementById('pConfirmPw').value;

    if (!name) { showToast('Please enter your full name.', 'error'); return; }
    if (newPw && newPw !== confirmPw) { showToast('New passwords do not match.', 'error'); return; }
    if (newPw && newPw.length < 6)   { showToast('Password must be at least 6 characters.', 'error'); return; }

    /* Save to localStorage */
    localStorage.setItem('userProfile', JSON.stringify({ name, email, contact, role }));

    updateDisplay();
    lockFields();

    document.getElementById('pCurrPw').value    = '';
    document.getElementById('pNewPw').value     = '';
    document.getElementById('pConfirmPw').value = '';

    showToast('Profile saved successfully!', 'success');
  }

  /* ── Logout ── */
  function confirmLogout() {
    showConfirm('Logout', 'Are you sure you want to logout?', function() {
      window.location.href = 'login.html';
    });
    return false;
  }
  
  /* ── Handle photo upload ── */
function handlePhotoUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const photoData = e.target.result;
    /* Save to localStorage */
    localStorage.setItem('profilePhoto', photoData);
    /* Display it */
    showProfilePhoto(photoData);
    showToast('Profile photo updated!', 'success');
  };
  reader.readAsDataURL(file);
}

/* ── Show photo or fallback to emoji ── */
function showProfilePhoto(photoData) {
  if (photoData) {
    document.getElementById('profileImg').src = photoData;
    document.getElementById('profileImg').style.display = 'block';
    document.getElementById('avatarEmoji').style.display = 'none';
  } else {
    document.getElementById('profileImg').style.display = 'none';
    document.getElementById('avatarEmoji').style.display = 'block';
  }
}

</script>

</body>
</html>
